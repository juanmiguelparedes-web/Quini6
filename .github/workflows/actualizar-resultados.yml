name: Actualizar resultados Quini 6
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1,4'
    - cron: '30 12 * * 1,4'
permissions:
  contents: write
concurrency:
  group: actualizar-quini6
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar y validar sorteo
        run: python scripts/actualizar_resultados.py
      - name: Guardar resultados si cambiaron
        run: |
          if ! git diff --quiet -- resultados.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resultados.json
            git commit -m "Actualizar resultados Quini 6"
            git push
          fi
